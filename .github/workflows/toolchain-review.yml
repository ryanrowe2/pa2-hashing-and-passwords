name: Review pinned Ubuntu toolchain

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-toolchain-updates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review newer available Ubuntu packages
        run: bash ci/audit-toolchain.sh
