name: C build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      # actions/checkout v7.0.1, pinned to its immutable release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce toolchain-update review in required GCC check
        if: matrix.compiler == 'gcc'
        run: bash ci/audit-toolchain.sh
      - name: Install locked Ubuntu toolchain
        run: bash ci/install-toolchain.sh
      - name: Record full installed-package manifest and fingerprint
        run: bash ci/record-environment.sh
      - name: Build and test
        run: make CC=${{ matrix.compiler }} test
      - name: Static analysis (Clang)
        if: matrix.compiler == 'clang'
        run: make analyze
      - name: Verify configuration-aware incremental rebuilds (Clang runner)
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          make CC=gcc build/pwcrack | tee /tmp/rebuild-gcc.log
          grep -q 'with gcc ' /tmp/rebuild-gcc.log
          make CC=clang SANITIZE=1 build/pwcrack | tee /tmp/rebuild-sanitizer.log
          grep -q -- '-fsanitize=address,undefined' /tmp/rebuild-sanitizer.log
          make CC=clang build/pwcrack | tee /tmp/rebuild-clang.log
          grep -q 'with clang ' /tmp/rebuild-clang.log
          sleep 1
          touch Makefile
          make CC=clang build/pwcrack | tee /tmp/rebuild-makefile.log
          grep -q 'with clang ' /tmp/rebuild-makefile.log
      - name: Sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: make CC=clang SANITIZE=1 test
