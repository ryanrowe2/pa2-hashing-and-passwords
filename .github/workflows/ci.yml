name: C build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      # actions/checkout v7.0.1, pinned to its immutable release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install locked Ubuntu toolchain
        run: bash ci/install-toolchain.sh
      - name: Record environment dependency versions
        run: |
          gcc --version | head -n 1
          clang --version | head -n 1
          python3 --version
          openssl version
          dpkg-query -W -f='${Package} ${Version}\n' build-essential clang libssl-dev python3
      - name: Build and test
        run: make CC=${{ matrix.compiler }} test
      - name: Static analysis (Clang)
        if: matrix.compiler == 'clang'
        run: make analyze
      - name: Verify configuration-aware incremental rebuilds (Clang runner)
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          make CC=gcc build/pwcrack | tee /tmp/rebuild-gcc.log
          grep -q '^gcc ' /tmp/rebuild-gcc.log
          make CC=clang SANITIZE=1 build/pwcrack | tee /tmp/rebuild-sanitizer.log
          grep -q -- '-fsanitize=address,undefined' /tmp/rebuild-sanitizer.log
          make CC=clang build/pwcrack | tee /tmp/rebuild-clang.log
          grep -q '^clang ' /tmp/rebuild-clang.log
          sleep 1
          touch Makefile
          make CC=clang build/pwcrack | tee /tmp/rebuild-makefile.log
          grep -q '^clang ' /tmp/rebuild-makefile.log
      - name: Sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: make CC=clang SANITIZE=1 test
