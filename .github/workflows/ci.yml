name: C build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      # actions/checkout v4.2.2 (immutable reviewed commit)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Ubuntu toolchain dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libssl-dev python3
      - name: Build and test
        run: make CC=${{ matrix.compiler }} test
      - name: Static analysis (Clang)
        if: matrix.compiler == 'clang'
        run: make analyze
      - name: Verify configuration-aware incremental rebuilds (Clang runner)
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          make CC=gcc build/pwcrack | tee /tmp/rebuild-gcc.log
          grep -q '^gcc ' /tmp/rebuild-gcc.log
          make CC=clang SANITIZE=1 build/pwcrack | tee /tmp/rebuild-sanitizer.log
          grep -q -- '-fsanitize=address,undefined' /tmp/rebuild-sanitizer.log
          make CC=clang build/pwcrack | tee /tmp/rebuild-clang.log
          grep -q '^clang ' /tmp/rebuild-clang.log
      - name: Sanitizers (Clang)
        if: matrix.compiler == 'clang'
        run: make CC=clang SANITIZE=1 test
